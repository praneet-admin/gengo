name: 💡 Idea or request
description: Something Gengo should do, or a word source / language you want.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: "A Telugu translation option / export My Words to CSV / a 10-minute sprint…"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you doing today without it?
      description: This helps us judge how much it matters.
  - type: dropdown
    id: who
    attributes:
      label: Who are you?
      options:
        - Student preparing for placements / exams
        - Working professional
        - Teacher
        - Other
